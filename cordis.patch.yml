# DSH bundle patch, applied when this package is installed as a bundle.
- insert:
    - id: lessons
      name: 'dsh-lessons'
      config:
        # Uncomment and set an absolute path to pin the data directory.
        # Omitted, it defaults to <cwd>/dsh-lessons-data.
        # taskDir: '/absolute/path/to/dsh-lessons-data'
        fsyncEvery: 16
        injectReflection: true
        recordEvents: true
        taskBoundaryHints: true
        # 任务状态从 tasks.jsonl 推导（默认开启）。
        # 开启后：插件重载 / 进程重启不会丢失「进行中的任务」「可反思的任务」
        # 「哪些会话开过任务」「已提醒几次」——这些都从文件重建。
        # 关闭则退回纯内存态（重载即丢，用于对照实验）。
        stateFromFile: true
        # 是否把「决策环境快照」渲染进反思材料（默认开启）。
        # 记录本身始终写入 task_open.environment，与本开关无关（供事后审计）。
        # 开启：反思时不用回翻 system prompt，近因下更易判断「有没有遵循」；
        # 关闭：省约 800 token/次反思（实测 11 条经验 ≈ 1986 字符）。
        environmentInBrief: true
        # 复盘保持安静（默认开启）：要求模型把复盘放在思维链里，不要写成对外回复。
        # 实测：50% 的复盘会先写一段对外文本（平均 784 字符，最长 6660）。
        # 这段文本不进入反思记录（记录只读 task_reflect 的参数），
        # 但会作为 ASSISTANT 条目落进之后某个任务的决策轨迹。
        silentReflection: true
        lessons:
          enabled: true
          sectionName: 'lessons:accumulated'
          order: 10500
          maxLessons: 0
          diagnostics: true
          scopes:
            global: true
            session: true
            reflection: true
          # ── 缓存友好：攒批 + 即时通知 ──────────────────────────────
          # 实测（2026-11-07）：plugin 类注入命中率 >= 99.6%，
          # system/message 变更命中率 <= 0.7%。所以新反思先走即时通知
          # （零缓存代价），攒够阈值才改一次 system prompt。
          # 关闭 batching 后 section 恢复实时反映全部条目（每条反思都会重算）。
          batching: true
          # 仅在 batching 开启时有效；关闭 batching 时自动失效（避免重复）
          instantNotice: true
          # 待提交条数达到该值即提交；0 = 只看 token 阈值
          commitEvery: 8
          # 待提交 token 阈值（按字符数/3 粗估）；0 = 不按 token 判断
          commitEveryTokens: 0

        # ── 反思质量控制 ────────────────────────────────────────────────
        # 结构化自我反对（**默认关闭**）。
        # 开启后每条经验必须附一份可追溯的论证：claim / premises / evidence /
        # inference / conclusion / steelman_rounds / counterexamples / scope /
        # alternatives / revision_conditions / unresolved，以及三项有效性
        # （演绎 / 归纳 / 前提真实性）。
        # 反方必须**迭代补强**至少 2 轮，每轮指向论证的不同环节，
        # 并留下 opposition_residual（反驳之后仍未驳倒的部分）——
        # 只反驳一次就宣布通过，等于没做。
        # 默认关闭的理由是成本：这不是"再想一遍"，而是要求把论证逐项写出来。
        adversarialReview: false

        # 先例原则（默认开启）。
        # 挑战一条已生效的经验（relation: revise）必须引用至少一个
        # 「在该经验生效期间发生、且结果失败」的任务 id。
        # 三条都能机械验证：任务存在、不是 succeeded、当时该经验确实在快照里。
        # 「与其适用条件匹配」是语义判断，程序不验证。
        precedentGate: true

        # 把先例强度（verified / counterexample 次数）渲染进 system prompt。
        # 「验证有效」是或然性的：成功一次算一次，失败一次算一个反例。
        # 计数来自 task_open.environment 与 task_close.status 的 join，
        # 不需要模型自评，也不需要对照组。
        precedentInPrompt: true

        # ── 兜底入口 ────────────────────────────────────────────────────
        # 按轮反思（**默认关闭**）：绕过 task_start / task_end 框选的范围，
        # 每回合结束直接把该回合发生的事交给模型反思一次。
        #
        # 它解决的不是"反思粒度"，而是**入口依赖模型**这个问题：
        # 任务模式下，模型忘了开任务就没有任何材料 —— 入口在模型手里。
        # 按轮模式下材料由 turn 边界产生，模型无法通过"不开任务"关掉它。
        #
        # 代价是反思质量：turn 边界不是决策边界。实测本机 20 个可分析任务里
        # 30% 跨了 2 个以上 turn（最多 13 个），按轮切分会把一个决策过程切成
        # 几段，每段单独看都缺前因。它保证的是"至少被检查过"，
        # 不是"被正确检查过"。材料里已写明这个局限。
        #
        # 与 missedTaskNudge 完全独立：关掉提醒不影响按轮反思（反之亦然）。
        #
        # 投递方式固定为「排入待注入队列，下一次装配时交给模型」。
        # 当前 DSH 的 Agent 接口只有 readonly id，没有 inject/followup 等推送通道，
        # 无法立刻唤醒模型，因此这里不设 mode 开关（曾经有过，但不生效，只会误导）。
        turnReflection: false

        # ── 任务边界提醒 ────────────────────────────────────────────────
        # 一回合做了实质工作、且该回合没有被任何任务覆盖时，在回合收尾陈述一次。
        #
        # 判定是**按本回合**，不是按整个会话。旧实现用「会话开过任务吗」，
        # 导致开过一次就永久豁免：实测漏掉过连续 4 轮
        # （127/73/21/62 次工具调用全部无 task_start，0 条提醒记录）。
        #
        # 「本回合已被覆盖」= 本回合有 task_start / task_end，
        # 或会话当前有 open 任务（跨轮任务的中间轮，本来就在范围内，不该打扰）。
        #
        # 投递方式同上：只有队列一条路，没有 mode 开关。
        missedTaskNudge: true
        # 触发提醒所需的最少工具调用次数（有文件改动时无条件触发）
        missedTaskMinCalls: 8
        # 每会话最多提醒几次，防止反复打扰。提醒本身不强制，见 missedTaskText
        missedTaskMaxPerSession: 2
