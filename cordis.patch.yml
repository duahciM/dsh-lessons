- insert:
    - id: metacog-task
      name: '@local/dsh-metacog-task'
      config:
        # 改成你的记忆存放目录（绝对路径）
        taskDir: '<你的数据目录>/metacog-task-data'
        fsyncEvery: 16
        injectReflection: true
        recordEvents: true
        # 任务边界提示：告诉模型「什么时候」调用 task_start / task_end
        taskBoundaryHints: true
        lessons:
          enabled: true
          sectionName: 'metacog:accumulated-lessons'
          order: 10500
          maxLessons: 0
          diagnostics: true
          scopes:
            global: true
            session: true
            reflection: true
